/* 27/09/2026: un clic en el logo no se queda con el teclado (Espacio seguía sin bajar la página en
   Chrome/Edge) ni selecciona sus números en azul. Además suelta el control de la página que tuviera el
   foco (p. ej. "Use hand control" del árbol): si no, Espacio lo volvía a pulsar y encendía la cámara. */
document.addEventListener('mousedown', function (e) {
  e.preventDefault();
  try { var a = parent.document.activeElement; if (a && a !== parent.document.body && a !== window.frameElement) a.blur(); } catch (_) {}
}, true);
</script>

  -webkit-mask-image:linear-gradient(to right,transparent 5.4%,#000 13%,#000 87%,transparent 94.6%),linear-gradient(to bottom,transparent 5.4%,#000 13%,#000 87%,transparent 94.6%);

      return {
        ax: L.ax, ay: L.ay, cx: +(L.l + L.w / 2).toFixed(2), cy: +(L.t + L.h / 2).toFixed(2),
        stroke: on ? '#F0B45A' : 'rgba(240,180,90,0.22)',
        title: (i + 1) + ' · ' + L.s + '  (' + L.ax + ', ' + L.ay + ')',
        onDown: this.onPinDown(i),
        dotStyle: 'position:absolute;left:' + L.ax + '%;top:' + L.ay + '%;width:' + (on ? 17 : 10) + 'px;height:' + (on ? 17 : 10) + 'px;margin:' + (on ? -8.5 : -5) + 'px;border-radius:50%;background:' + (on ? '#F0B45A' : 'rgba(10,22,32,0.85)') + ';border:2px solid ' + (on ? '#FFD9A0' : 'rgba(240,180,90,0.6)') + ';box-shadow:0 0 0 1px rgba(0,0,0,0.5);z-index:900;cursor:grab;pointer-events:auto;touch-action:none'
      };
    }).filter(Boolean);

    return {
      stage: this.stage, layers, pins, edit, hoverBox: this.hoverBox,
      panelOpen: st.panelOpen,
      panelBtn: st.panelOpen ? 'ocultar ▾' : 'controles ▴',
      togglePanel: () => this.setState({ panelOpen: !st.panelOpen }),
      allPinsLabel: st.allPins ? 'todos los puntos' : 'solo este punto',
      allPinsStyle: 'appearance:none;border:1px solid ' + (st.allPins ? '#4A3A18' : '#16303A') + ';background:#0A1620;color:' + (st.allPins ? '#F0B45A' : '#5D7681') + ";font-family:'JetBrains Mono', monospace;font-size:11px;padding:7px 11px;border-radius:8px;cursor:pointer",
      togglePins: () => this.setState({ allPins: !st.allPins }),
      onStageMove: this.onStageMove, onStageLeave: this.onStageLeave, onStageDown: this.onStageDown,
      onRotDown: this.onRotDown, onSclDown: this.onSclDown,
      selBox: edit && !!S,
      selBoxStyle: S ? 'position:absolute;left:' + S.l + '%;top:' + S.t + '%;width:' + S.w + '%;height:' + S.h + '%;outline:1.5px dashed #22D3EE;outline-offset:4px;z-index:880;pointer-events:none' : '',
      modeLabel: edit ? 'acomodo' : 'animación',
      modeBtn: edit ? 'ver animación' : 'acomodar plantas',
      toggleMode: () => { this.frozen = false; this.setState({ mode: edit ? 'anim' : 'edit', msg: '' }); },
      maxIndex: Math.max(0, Ls.length - 1),
      sel,
      onSlider: (e) => this.setState({ sel: Number(e.target.value) }),
      prevLayer: () => this.setState({ sel: (sel - 1 + Ls.length) % Ls.length }),
      nextLayer: () => this.setState({ sel: (sel + 1) % Ls.length }),
      selLabel: S ? (sel + 1) + '/' + Ls.length + ' · ' + S.s + ' · pos ' + S.l + ',' + S.t + ' · ancla ' + S.ax + ',' + S.ay : '—',
      rotMinus: () => this.mut(sel, { r: S.r - 3 }),
      rotPlus: () => this.mut(sel, { r: S.r + 3 }),
      sclMinus: () => this.mut(sel, { w: +(S.w * 0.94).toFixed(2), h: +(S.h * 0.94).toFixed(2) }),
      sclPlus: () => this.mut(sel, { w: +(S.w * 1.06).toFixed(2), h: +(S.h * 1.06).toFixed(2) }),
      flipH: () => this.mut(sel, { f: S.f * -1 }),
      zBack: () => this.mut(sel, { z: Math.max(2, S.z - 4) }),
      zFront: () => this.mut(sel, { z: S.z + 4 }),
      duplicate: () => this.setState(s2 => {
        const L = s2.layers.slice();
        L.splice(sel + 1, 0, Object.assign({}, L[sel], { l: +(L[sel].l + 3).toFixed(2), t: +(L[sel].t + 3).toFixed(2) }));
        this.persist(L); return { layers: L, sel: sel + 1 };
      }),
      remove: () => this.setState(s2 => {
        if (s2.layers.length <= 1) return null;
        const L = s2.layers.slice(); L.splice(sel, 1);
        this.persist(L); return { layers: L, sel: Math.min(sel, L.length - 1) };
      }),
      pin: st.pin,
      togglePin: () => this.setState({ pin: !st.pin, msg: st.pin ? '' : 'haz clic donde quieras el punto' }),
      pinBtnLabel: st.pin ? 'clic en el lienzo…' : 'fijar con un clic',
      pinBtnStyle: 'appearance:none;border:1px solid ' + (st.pin ? '#F0B45A' : '#16303A') + ';background:' + (st.pin ? '#2A1E0A' : '#0A1620') + ';color:' + (st.pin ? '#FFD9A0' : '#D6E4DE') + ";font-family:'JetBrains Mono', monospace;font-size:11.5px;padding:8px 12px;border-radius:8px;cursor:pointer",
      snapPin: () => this.mut(sel, this.edgeAnchor(S)),
      centerPin: () => this.mut(sel, { ax: +(S.l + S.w / 2).toFixed(2), ay: +(S.t + S.h / 2).toFixed(2) }),
      copyJson: () => {
        const txt = JSON.stringify(Ls, null, 1);
        try { navigator.clipboard.writeText(txt); this.setState({ msg: 'JSON copiado (' + Ls.length + ' capas)' }); }
        catch (e) { this.setState({ msg: 'no se pudo copiar' }); }
      },
      resetAll: () => { const L = this.SEED.map(o => Object.assign({}, o)); this.persist(L); this.setState({ layers: L, sel: 0, msg: 'reiniciado' }); },
      msg: st.msg,
      tri1GStyle: triG(0), tri2GStyle: triG(1), tri3GStyle: triG(2),
      triMode, triDots, triPickers,
      triModeBtn: triMode ? 'cerrar' : 'triángulos',
      triModeBtnStyle: 'appearance:none;border:1px solid ' + (triMode ? '#22D3EE' : '#16303A') + ';background:' + (triMode ? '#0D2A30' : '#0A1620') + ';color:#22D3EE;font-family:\'JetBrains Mono\', monospace;font-size:11px;letter-spacing:.1em;padding:9px 14px;border-radius:9px;cursor:pointer',
      toggleTriMode: () => this.setState(s2 => ({ mode: s2.mode === 'tri' ? 'anim' : 'tri' })),
      triRotMinus: () => this.mutTri(triSel, { rot: +((curTri.rot || 0) - 1).toFixed(2) }),
      triRotPlus: () => this.mutTri(triSel, { rot: +((curTri.rot || 0) + 1).toFixed(2) }),
      triRotVal: +((curTri.rot || 0).toFixed(2)),
      triRotInput: (e) => { const v = parseFloat(e.target.value); this.mutTri(triSel, { rot: isNaN(v) ? 0 : v }); },
      triSclMinus: () => this.mutTri(triSel, { scl: +Math.max(0.4, (curTri.scl || 1) - 0.05).toFixed(2) }),
      triSclPlus: () => this.mutTri(triSel, { scl: +Math.min(2.5, (curTri.scl || 1) + 0.05).toFixed(2) }),
      triSclLabel: Math.round((curTri.scl || 1) * 100) + '%',
      triResetOne: () => this.mutTri(triSel, { dx: 0, dy: 0, rot: 0, scl: 1 }),
      triResetAll: () => { const T = this.triDefault(); this.persistTri(T); this.setState({ triT: T }); },
      triOpacity: st.triReady ? 1 : 0
    };
  }
}

</script>
</body>
